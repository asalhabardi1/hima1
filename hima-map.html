<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HIMA | Geographic Location</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100%;
            background: #e8e8e8;
        }

        .map-status {
            position: absolute;
            bottom: 15px;
            left: 15px;
            z-index: 1000;
            background: rgba(255,255,255,0.95);
            padding: 9px 13px;
            border-radius: 5px;
            font: 12px Arial, sans-serif;
            color: #52664F;
            box-shadow: 0 1px 5px rgba(0,0,0,0.2);
        }

        .leaflet-control-layers {
            font-family: Arial, sans-serif;
        }
    </style>
</head>

<body>

<div id="map"></div>
<div class="map-status" id="status">
    Loading geographic boundaries...
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

    // Initialize map
    const map = L.map("map", {
        zoomControl: true
    });

    // Esri World Imagery
    const imagery = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        {
            attribution: "Tiles © Esri",
            maxZoom: 19
        }
    ).addTo(map);

    // Saudi Arabia boundary
    const saudiLayer = L.geoJSON(null, {
        style: {
            color: "#52664F",
            weight: 2,
            opacity: 0.95,
            fillOpacity: 0
        }
    }).addTo(map);

    // ITBA Royal Reserve boundary
    const reserveLayer = L.geoJSON(null, {
        style: {
            color: "#228B22",
            weight: 3,
            opacity: 1,
            fillColor: "#228B22",
            fillOpacity: 0.06
        }
    }).addTo(map);

    // Layer control
    L.control.layers(
        {
            "Esri World Imagery": imagery
        },
        {
            "Saudi Arabia Boundary": saudiLayer,
            "ITBA Reserve Boundary": reserveLayer
        },
        {
            collapsed: false
        }
    ).addTo(map);

    // Load Saudi Arabia GeoJSON
    const saudiPromise = fetch("./Saudi_Arabia_Boundary.geojson")
        .then(response => {
            if (!response.ok) {
                throw new Error("Saudi boundary file could not be loaded.");
            }
            return response.json();
        })
        .then(data => {
            saudiLayer.addData(data);
            return data;
        });

    // Load ITBA Reserve GeoJSON
    const reservePromise = fetch("./ITBA_Reserve_Boundary.geojson")
        .then(response => {
            if (!response.ok) {
                throw new Error("ITBA boundary file could not be loaded.");
            }
            return response.json();
        })
        .then(data => {
            reserveLayer.addData(data);
            return data;
        });

    // Wait for both boundaries
    Promise.all([saudiPromise, reservePromise])
        .then(() => {

            const bounds = saudiLayer.getBounds();

            if (bounds.isValid()) {
                map.fitBounds(bounds, {
                    padding: [20, 20]
                });
            }

            document.getElementById("status").textContent =
                "Geographic boundaries loaded successfully";

        })
        .catch(error => {

            console.error(error);

            document.getElementById("status").textContent =
                "Error loading boundaries. Check GeoJSON files.";

        });

</script>

</body>
</html>
